syntax = "proto3";

package com.notirail.credential.cache.service.proto;

option java_package = "com.notirail.credential.cache.service.proto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

service CredentialCacheService {
    rpc ApplyCredentialEvent(CredentialEvent)
        returns (ApplyCredentialEventResponse);
}

enum CredentialEventType {
    CREDENTIAL_UNSPECIFIED = 0;
    CREDENTIAL_CREATED = 1;
    CREDENTIAL_UPDATED = 2;
    CREDENTIAL_REVOKED = 3;
}

message CredentialEvent {
    string event_id = 1;
    CredentialEventType event_type = 2;

    string credential_id = 3;
    string key_id = 4;

    CredentialSnapshot snapshot = 5;

    google.protobuf.Timestamp occurred_at = 6;
}

message CredentialSnapshot {
    string credential_id = 1;
    string key_id = 2;
    string secret_hash = 3;
    string partner_id = 4;
    optional string project_id = 5;
    repeated string scopes = 6;
    optional google.protobuf.Timestamp expires_at = 7;
}

message ApplyCredentialEventResponse {
    string event_id = 1;
    ApplyResult result = 2;
}

enum ApplyResult {
    UNSPECIFIED = 0;
    APPLIED = 1;
    ALREADY_APPLIED = 2;
}
