name: Release

on:
    workflow_dispatch:
        inputs:
            module:
                description: "Released module"
                required: true
                type: choice
                options:
                    - credential-api
                    - credential-proto
                    - credential-service
                    - credential-cache-service
                    - credential-relay-service

            version:
                description: "Release version, e.g. 0.1.0"
                required: true
                type: string

            dry_run:
                description: "Build and test without publishing"
                required: false
                type: boolean
                default: false

permissions:
    contents: write
    packages: write

concurrency:
    group: credential-platform-release-${{ github.event.inputs.module }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Set up Java 25
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: "25"

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4

            -   name: Validate version
                run: |
                    if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Version must use semantic versioning, for example 0.1.0"
                      exit 1
                    fi

            -   name: Build and test module
                working-directory: credential-platform
                run: ./gradlew :${{ inputs.module }}:clean :${{ inputs.module }}:build --no-daemon

            -   name: Publish Maven artifact
                if: ${{ inputs.dry_run == false && (inputs.module == 'credential-api' || inputs.module == 'credential-proto') }}
                working-directory: credential-platform
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                  ./gradlew :${{ inputs.module }}:publish -PapiVersion=${{ inputs.version }} --no-daemon

            -   name: Log in to GitHub Container Registry
                if: ${{ inputs.dry_run == false && (inputs.module == 'credential-service' || inputs.module == 'credential-cache-service' || inputs.module == 'credential-relay-service') }}
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push service image
                if: ${{ inputs.dry_run == false && (inputs.module == 'credential-service' || inputs.module == 'credential-cache-service' || inputs.module == 'credential-relay-service') }}
                uses: docker/build-push-action@v6
                with:
                    context: credential-platform/${{ inputs.module }}
                    file: credential-platform/${{ inputs.module }}/Dockerfile
                    push: true
                    tags: |
                        ghcr.io/${{ github.repository_owner }}/notirail/${{ inputs.module }}:${{ inputs.version }}
                    build-contexts: |
                        gradle-root=credential-platform
                        proto=credential-platform/credential-proto
                        api=credential-platform/credential-api

            -   name: Create Git tag
                if: ${{ inputs.dry_run == false }}
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"

                    TAG="${{ inputs.module }}-v${{ inputs.version }}"

                    if git rev-parse "$TAG" >/dev/null 2>&1; then
                      echo "Tag already exists: $TAG"
                      exit 1
                    fi

                    git tag "$TAG"
                    git push origin "$TAG"
