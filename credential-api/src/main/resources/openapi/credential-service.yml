openapi: 3.1.0
info:
    title: Notirail Credential API
    description: >
        A Notirail Credential Platform adminisztratív API-ja.
        Kezeli a credentialöket, azok key-eit, scope-jait,
        partner/project hozzárendeléseit és életciklusát.
    version: ${API_VERSION}

servers:
    - url: http://localhost:8080
      description: Local development

tags:
    - name: Credentials
      description: Credential lifecycle és metadata
    - name: Credential keys
      description: Credential key lifecycle és rotation

paths:
    /api/v1/credentials:
        post:
            tags:
                - Credentials
            operationId: createCredential
            summary: Új credential és első key létrehozása
            description: >
                Létrehoz egy új credentialt és annak első aktív key-ét.
                A nyers bearer credential kizárólag a válaszban jelenik meg egyszer.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCredentialRequest'
            responses:
                '201':
                    description: A credential és az első key létrejött
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialCreatedResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '409':
                    $ref: '#/components/responses/Conflict'

    /api/v1/credentials/{credentialId}:
        get:
            tags:
                - Credentials
            operationId: getCredential
            summary: Credential lekérdezése
            parameters:
                - $ref: '#/components/parameters/CredentialId'
            responses:
                '200':
                    description: A credential részletei
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialResponse'
                '404':
                    $ref: '#/components/responses/NotFound'

        patch:
            tags:
                - Credentials
            operationId: updateCredential
            summary: Credential metadata módosítása
            description: >
                Módosítja a credential scope-jait, projekt hozzárendelését,
                lejáratát vagy státuszát. A sikeres módosítás outbox eventet generál.
            parameters:
                - $ref: '#/components/parameters/CredentialId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCredentialRequest'
            responses:
                '200':
                    description: A credential frissült
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'

    /api/v1/credentials/{credentialId}/keys:
        get:
            tags:
                - Credential keys
            operationId: listCredentialKeys
            summary: Credential keyek listázása
            parameters:
                - $ref: '#/components/parameters/CredentialId'
            responses:
                '200':
                    description: A credentialhez tartozó keyek
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialKeyListResponse'
                '404':
                    $ref: '#/components/responses/NotFound'

        post:
            tags:
                - Credential keys
            operationId: createCredentialKey
            summary: Új credential key létrehozása rotációhoz
            description: >
                Létrehoz egy új, aktív key-t a megadott credentialhez.
                A korábbi keyek érvényben maradnak, amíg külön nem vonja vissza őket a hívó.
            parameters:
                - $ref: '#/components/parameters/CredentialId'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCredentialKeyRequest'
            responses:
                '201':
                    description: Az új key létrejött
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialKeyCreatedResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'

    /api/v1/credentials/{credentialId}/keys/{keyId}:
        get:
            tags:
                - Credential keys
            operationId: getCredentialKey
            summary: Egy credential key lekérdezése
            parameters:
                - $ref: '#/components/parameters/CredentialId'
                - $ref: '#/components/parameters/KeyId'
            responses:
                '200':
                    description: A key részletei
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialKeyResponse'
                '404':
                    $ref: '#/components/responses/NotFound'

    /api/v1/credentials/{credentialId}/keys/{keyId}/revocations:
        post:
            tags:
                - Credential keys
            operationId: revokeCredentialKey
            summary: Egy konkrét credential key visszavonása
            description: >
                A megadott key állapotát REVOKED-ra állítja.
                A művelet outbox eventet hoz létre, amely a cache service-ben
                érvényteleníti az adott key Redis alapú authorization snapshotját.
            parameters:
                - $ref: '#/components/parameters/CredentialId'
                - $ref: '#/components/parameters/KeyId'
            responses:
                '200':
                    description: A key sikeresen visszavonva
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialKeyResponse'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'

components:
    parameters:
        CredentialId:
            name: credentialId
            in: path
            required: true
            description: A credential belső azonosítója.
            schema:
                type: string
                format: uuid

        KeyId:
            name: keyId
            in: path
            required: true
            description: A credential key globálisan egyedi azonosítója.
            schema:
                type: string
                maxLength: 128

    responses:
        ValidationError:
            description: Érvénytelen kérés
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'

        NotFound:
            description: Az erőforrás nem található
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'

        Conflict:
            description: Ütköző állapot
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'

    schemas:
        CreateCredentialRequest:
            type: object
            required:
                - partnerId
                - scopes
            properties:
                partnerId:
                    type: string
                    maxLength: 128
                    description: A credentialhöz tartozó partner azonosítója.
                projectId:
                    type: string
                    maxLength: 128
                    description: Opcionális, partneren belüli projekt azonosító.
                scopes:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        type: string
                    example:
                        - messages:send
                        - messages:read
                expiresAt:
                    type: string
                    format: date-time
                    description: Opcionális üzleti lejárat.

        CredentialCreatedResponse:
            type: object
            required:
                - credentialId
                - keyId
                - credential
                - key
            properties:
                credentialId:
                    type: string
                    format: uuid
                keyId:
                    type: string
                credential:
                    type: string
                    description: >
                        Az egyszeri, nyers bearer credential.
                        Később nem kérhető le és nem tárolódik nyers formában.
                key:
                    $ref: '#/components/schemas/CredentialKeyResponse'

        CredentialResponse:
            type: object
            required:
                - credentialId
                - partnerId
                - status
                - scopes
                - keys
            properties:
                credentialId:
                    type: string
                    format: uuid
                partnerId:
                    type: string
                projectId:
                    type: string
                status:
                    type: string
                    enum:
                        - ACTIVE
                        - REVOKED
                        - EXPIRED
                        - SUSPENDED
                scopes:
                    type: array
                    items:
                        type: string
                expiresAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/CredentialKeyResponse'

        UpdateCredentialRequest:
            type: object
            minProperties: 1
            properties:
                projectId:
                    type: string
                    maxLength: 128
                scopes:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        type: string
                expiresAt:
                    type: string
                    format: date-time
                status:
                    type: string
                    enum:
                        - ACTIVE
                        - SUSPENDED

        CredentialKeyListResponse:
            type: object
            required:
                - credentialId
                - keys
            properties:
                credentialId:
                    type: string
                    format: uuid
                keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/CredentialKeyResponse'

        CreateCredentialKeyRequest:
            type: object
            properties:
                expiresAt:
                    type: string
                    format: date-time
                    description: Opcionális lejárat az új keyhez.

        CredentialKeyCreatedResponse:
            type: object
            required:
                - credentialId
                - keyId
                - credential
                - key
            properties:
                credentialId:
                    type: string
                    format: uuid
                keyId:
                    type: string
                credential:
                    type: string
                    description: >
                        Az új keyhez tartozó, egyszeri nyers bearer credential.
                        Később nem kérhető le.
                key:
                    $ref: '#/components/schemas/CredentialKeyResponse'

        CredentialKeyResponse:
            type: object
            required:
                - keyId
                - status
                - createdAt
            properties:
                keyId:
                    type: string
                status:
                    type: string
                    enum:
                        - ACTIVE
                        - REVOKED
                        - EXPIRED
                expiresAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                revokedAt:
                    type: string
                    format: date-time

        Problem:
            type: object
            required:
                - title
                - status
            properties:
                type:
                    type: string
                    format: uri-reference
                title:
                    type: string
                status:
                    type: integer
                detail:
                    type: string
                instance:
                    type: string
                    format: uri-reference
