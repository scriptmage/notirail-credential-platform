openapi: 3.1.0
info:
    title: Notirail Credential API
    description: >
        Administrative API for the Notirail Credential Platform.
        Manages credentials, their keys, scopes, partner/project assignments,
        and lifecycle.
    version: ${API_VERSION}

servers:
    - url: http://localhost:8080
      description: Local development

tags:
    - name: Credentials
      description: Credential lifecycle and metadata
    - name: Credential keys
      description: Credential key lifecycle and rotation

paths:
    /api/v1/credentials:
        post:
            tags:
                - Credentials
            operationId: createCredential
            summary: Create a new credential and its first key
            description: >
                Creates a new credential and its first active key.
                The raw bearer credential is shown only once in the response.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCredentialRequest'
            responses:
                '201':
                    description: The credential and first key were created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialCreatedResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '409':
                    $ref: '#/components/responses/Conflict'

    /api/v1/credentials/{credentialId}:
        get:
            tags:
                - Credentials
            operationId: getCredential
            summary: Retrieve a credential
            parameters:
                - $ref: '#/components/parameters/CredentialId'
            responses:
                '200':
                    description: Credential details
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialResponse'
                '404':
                    $ref: '#/components/responses/NotFound'

        patch:
            tags:
                - Credentials
            operationId: updateCredential
            summary: Update credential metadata
            description: >
                Updates the credential's scopes, project assignment,
                expiration, or status. A successful update generates an outbox event.
            parameters:
                - $ref: '#/components/parameters/CredentialId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCredentialRequest'
            responses:
                '200':
                    description: The credential was updated
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'

    /api/v1/credentials/{credentialId}/keys:
        get:
            tags:
                - Credential keys
            operationId: listCredentialKeys
            summary: List credential keys
            parameters:
                - $ref: '#/components/parameters/CredentialId'
            responses:
                '200':
                    description: The keys belonging to the credential
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialKeyListResponse'
                '404':
                    $ref: '#/components/responses/NotFound'

        post:
            tags:
                - Credential keys
            operationId: createCredentialKey
            summary: Create a new credential key for rotation
            description: >
                Creates a new active key for the specified credential.
                Previous keys remain valid until they are explicitly revoked by the caller.
            parameters:
                - $ref: '#/components/parameters/CredentialId'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCredentialKeyRequest'
            responses:
                '201':
                    description: The new key was created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialKeyCreatedResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'

    /api/v1/credentials/{credentialId}/keys/{keyId}:
        get:
            tags:
                - Credential keys
            operationId: getCredentialKey
            summary: Retrieve a credential key
            parameters:
                - $ref: '#/components/parameters/CredentialId'
                - $ref: '#/components/parameters/KeyId'
            responses:
                '200':
                    description: Key details
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialKeyResponse'
                '404':
                    $ref: '#/components/responses/NotFound'

    /api/v1/credentials/{credentialId}/keys/{keyId}/revocations:
        post:
            tags:
                - Credential keys
            operationId: revokeCredentialKey
            summary: Revoke a specific credential key
            description: >
                Sets the status of the specified key to REVOKED.
                The operation creates an outbox event that invalidates the key's
                Redis-based authorization snapshot in the cache service.
            parameters:
                - $ref: '#/components/parameters/CredentialId'
                - $ref: '#/components/parameters/KeyId'
            responses:
                '200':
                    description: The key was successfully revoked
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CredentialKeyResponse'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'

components:
    parameters:
        CredentialId:
            name: credentialId
            in: path
            required: true
            description: The credential's internal identifier.
            schema:
                type: string
                format: uuid

        KeyId:
            name: keyId
            in: path
            required: true
            description: The credential key's globally unique identifier.
            schema:
                type: string
                maxLength: 128

    responses:
        ValidationError:
            description: Invalid request
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'

        NotFound:
            description: Resource not found
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'

        Conflict:
            description: Conflicting state
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'

    schemas:
        CreateCredentialRequest:
            type: object
            required:
                - partnerId
                - scopes
            properties:
                partnerId:
                    type: string
                    maxLength: 128
                    description: The identifier of the partner associated with the credential.
                projectId:
                    type: string
                    maxLength: 128
                    description: Optional project identifier within the partner.
                scopes:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        type: string
                    example:
                        - messages:send
                        - messages:read
                expiresAt:
                    type: string
                    format: date-time
                    description: Optional business expiration date.

        CredentialCreatedResponse:
            type: object
            required:
                - credentialId
                - keyId
                - credential
                - key
            properties:
                credentialId:
                    type: string
                    format: uuid
                keyId:
                    type: string
                credential:
                    type: string
                    description: >
                        The one-time raw bearer credential.
                        It cannot be retrieved later and is not stored in raw form.
                key:
                    $ref: '#/components/schemas/CredentialKeyResponse'

        CredentialResponse:
            type: object
            required:
                - credentialId
                - partnerId
                - status
                - scopes
                - keys
            properties:
                credentialId:
                    type: string
                    format: uuid
                partnerId:
                    type: string
                projectId:
                    type: string
                status:
                    type: string
                    enum:
                        - ACTIVE
                        - REVOKED
                        - EXPIRED
                        - SUSPENDED
                scopes:
                    type: array
                    items:
                        type: string
                expiresAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/CredentialKeyResponse'

        UpdateCredentialRequest:
            type: object
            minProperties: 1
            properties:
                projectId:
                    type: string
                    maxLength: 128
                scopes:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        type: string
                expiresAt:
                    type: string
                    format: date-time
                status:
                    type: string
                    enum:
                        - ACTIVE
                        - SUSPENDED

        CredentialKeyListResponse:
            type: object
            required:
                - credentialId
                - keys
            properties:
                credentialId:
                    type: string
                    format: uuid
                keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/CredentialKeyResponse'

        CreateCredentialKeyRequest:
            type: object
            properties:
                expiresAt:
                    type: string
                    format: date-time
                    description: Optional expiration date for the new key.

        CredentialKeyCreatedResponse:
            type: object
            required:
                - credentialId
                - keyId
                - credential
                - key
            properties:
                credentialId:
                    type: string
                    format: uuid
                keyId:
                    type: string
                credential:
                    type: string
                    description: >
                        The one-time raw bearer credential associated with the new key.
                        It cannot be retrieved later.
                key:
                    $ref: '#/components/schemas/CredentialKeyResponse'

        CredentialKeyResponse:
            type: object
            required:
                - keyId
                - status
                - createdAt
            properties:
                keyId:
                    type: string
                status:
                    type: string
                    enum:
                        - ACTIVE
                        - REVOKED
                        - EXPIRED
                expiresAt:
                    type: string
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                revokedAt:
                    type: string
                    format: date-time

        Problem:
            type: object
            required:
                - title
                - status
            properties:
                type:
                    type: string
                    format: uri-reference
                title:
                    type: string
                status:
                    type: integer
                detail:
                    type: string
                instance:
                    type: string
                    format: uri-reference
